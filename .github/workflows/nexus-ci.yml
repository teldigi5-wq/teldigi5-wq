name: Nexus CI

on:
  push:
    branches: [main]
    paths:
      - 'projects/nexus-platform/**'
      - '.github/workflows/nexus-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'projects/nexus-platform/**'
      - '.github/workflows/nexus-ci.yml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: nexus-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: projects/nexus-platform/**/pom.xml

      - name: Build and test Nexus modules
        run: mvn -B -f projects/nexus-platform/pom.xml verify

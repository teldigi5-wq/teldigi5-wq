name: Refresh GitHub activity cards

on:
  schedule:
    # Daily, outside the usual top-of-hour Actions traffic.
    - cron: '23 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-activity.yml'

permissions:
  contents: write

concurrency:
  group: profile-activity-cards
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Generate current GitHub summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@09ba4dde3f9b05828cb99553561db3f4ff07703f
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          USERNAME: teldigi5-wq
          THEME: github_dark
          AUTO_PUSH: 'false'
          ANIMATION: 'none'

      - name: Test chart enhancements
        run: python3 scripts/enhance_activity_cards.py --self-test

      - name: Add actual language percentages and refresh date
        run: python3 scripts/enhance_activity_cards.py

      - name: Validate regenerated cards
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            profile-summary-card-output/github_dark/0-profile-details.svg \
            profile-summary-card-output/github_dark/1-repos-per-language.svg \
            profile-summary-card-output/github_dark/3-stats.svg
          do
            test -s "$file"
            grep -q '<svg' "$file"
          done
          grep -q 'data-profile-enhancement="percentage"' profile-summary-card-output/github_dark/1-repos-per-language.svg
          grep -q 'data-profile-enhancement="refreshed"' profile-summary-card-output/github_dark/0-profile-details.svg

      - name: Commit updated cards if necessary
        shell: bash
        run: |
          set -euo pipefail
          git add -- \
            profile-summary-card-output/github_dark/0-profile-details.svg \
            profile-summary-card-output/github_dark/1-repos-per-language.svg \
            profile-summary-card-output/github_dark/3-stats.svg
          if git diff --cached --quiet; then
            echo 'Statistics unchanged; nothing to commit.'
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'chore: refresh GitHub profile activity cards'
          git push origin HEAD:main

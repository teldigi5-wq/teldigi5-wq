<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="460" viewBox="0 0 1400 460" role="img" aria-labelledby="title desc">
<title id="title">Poojana Kaveesh — animated systems engineering banner</title>
<desc id="desc">Midnight-blue premium engineering banner, bold Poojana Kaveesh typography and animated vector isometric service blocks connected by luminous data streams for API, Data and Trust. The motion respects reduced-motion settings.</desc>
<defs>
<linearGradient id="background" x2="1" y2="1"><stop stop-color="#020914"/><stop offset=".58" stop-color="#06172D"/><stop offset="1" stop-color="#020A17"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#1E9BE4" stop-opacity=".34"/><stop offset="1" stop-color="#0B2441" stop-opacity="0"/></radialGradient>
<linearGradient id="titleGrad" x1="0" x2=".9" y1="0" y2="1"><stop stop-color="#FAFCFF"/><stop offset=".6" stop-color="#DCEAFF"/><stop offset="1" stop-color="#75BAFF"/></linearGradient>
<linearGradient id="cyan" x1="0" x2="1"><stop stop-color="#4AE4FE"/><stop offset=".48" stop-color="#6C9FFD"/><stop offset="1" stop-color="#34F0D3"/></linearGradient>
<linearGradient id="laser" x1="0" x2="1"><stop stop-color="#256DFF" stop-opacity=".12"/><stop offset=".4" stop-color="#76E8FF"/><stop offset=".8" stop-color="#4D8BFF"/><stop offset="1" stop-color="#3BD9D3" stop-opacity=".18"/></linearGradient>
<pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse"><path d="M34 0H0V34" fill="none" stroke="#73C9FD" opacity=".1" stroke-width=".7"/></pattern>
<filter id="blueBlur" x="-55%" y="-55%" width="210%" height="210%"><feGaussianBlur stdDeviation="12"/></filter>
<filter id="beamBlur" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="5"/></filter>
<clipPath id="round"><rect width="1396" height="456" x="2" y="2" rx="21"/></clipPath>
<style>
.name{font-family:'Arial', 'Segoe UI',sans-serif;font-weight:900;letter-spacing:1.5px}.mono{font-family:Consolas,Menlo,monospace}.caption{font-family:Arial,'Segoe UI',sans-serif}.dashFlow{stroke-dasharray:12 15;animation:flow 11s linear infinite}.ring{transform-origin:1110px 215px;animation:spin 42s linear infinite}.hoverBlock{animation:bob 6s ease-in-out infinite}.hoverBlock:nth-child(2){animation-delay:-2s}.hoverBlock:nth-child(3){animation-delay:-4s}.shimmer{animation:shimmer 5s ease-in-out infinite}.chip{animation:breathe 4s ease-in-out infinite}.beam{animation:beam 7s ease-in-out infinite}@keyframes flow{to{stroke-dashoffset:-324}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}@keyframes shimmer{0%,100%{opacity:.35}50%{opacity:1}}@keyframes beam{0%,100%{opacity:.25}50%{opacity:.7}}@media(prefers-reduced-motion: reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</defs>
<g clip-path="url(#round)">
<rect width="1400" height="460" fill="url(#background)"/><rect width="1400" height="460" fill="url(#grid)"/>
<circle cx="1110" cy="201" r="315" fill="url(#glow)"/><circle cx="330" cy="500" r="300" fill="url(#glow)" opacity=".32"/>

ity="0.19"/><circle cx="867" cy="400" r="0.7" fill="#7DBDEC" opacity="0.26"/><circle cx="1135" cy="276" r="0.7" fill="#7DBDEC" opacity="0.14"/><circle cx="1194" cy="227" r="1.3" fill="#7DBDEC" opacity="0.19"/><circle cx="875" cy="242" r="1.3" fill="#7DBDEC" opacity="0.19"/><circle cx="1160" cy="205" r="1.3" fill="#7DBDEC" opacity="0.26"/><circle cx="971" cy="99" r="0.7" fill="#7DBDEC" opacity="0.14"/><circle cx="889" cy="140" r="1.3" fill="#7DBDEC" opacity="0.14"/><circle cx="747" cy="270" r="1.3" fill="#7DBDEC" opacity="0.14"/><circle cx="1004" cy="166" r="0.7" fill="#7DBDEC" opacity="0.14"/><circle cx="1164" cy="295" r="1" fill="#7DBDEC" opacity="0.19"/><circle cx="863" cy="375" r="1.3" fill="#7DBDEC" opacity="0.08"/><circle cx="1202" cy="421" r="1.3" fill="#7DBDEC" opacity="0.26"/><circle cx="1142" cy="226" r="1" fill="#7DBDEC" opacity="0.08"/><circle cx="1228" cy="346" r="1" fill="#7DBDEC" opacity="0.08"/>

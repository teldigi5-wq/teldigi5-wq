<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Poojana Kaveesh engineering profile</title>
  <desc id="desc">Animated software and platform engineering portfolio banner</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/><stop offset="0.5" stop-color="#07162E"/><stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="accent" x1="200" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/><stop offset="0.5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <radialGradient id="glow"><stop stop-color="#38BDF8" stop-opacity=".28"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="20"/></filter>
    <style>
      .grid{opacity:.12}.pulse{animation:pulse 3.2s ease-in-out infinite}.float{animation:float 5s ease-in-out infinite}.dash{stroke-dasharray:10 14;animation:dash 8s linear infinite}.scan{animation:scan 4.5s ease-in-out infinite}.blink{animation:blink 1.1s steps(2,end) infinite}
      @keyframes pulse{0%,100%{opacity:.25;transform:scale(.94)}50%{opacity:.8;transform:scale(1.06)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
      @keyframes dash{to{stroke-dashoffset:-240}}
      @keyframes scan{0%{transform:translateX(-180px);opacity:0}20%,80%{opacity:.7}100%{transform:translateX(1380px);opacity:0}}
      @keyframes blink{50%{opacity:0}}
      .mono{font-family:'Courier New',monospace}.sans{font-family:Inter,Segoe UI,Arial,sans-serif}
    </style>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#38BDF8" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="300" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="24" fill="url(#grid)" class="grid"/>
  <circle cx="125" cy="55" r="150" fill="url(#glow)" filter="url(#blur)" class="pulse"/>
  <circle cx="1090" cy="260" r="170" fill="url(#glow)" filter="url(#blur)" class="pulse" style="animation-delay:1.2s"/>
  <path d="M80 226C210 188 305 254 435 214C560 175 665 222 780 187C890 154 983 192 1120 146" stroke="url(#accent)" stroke-width="2.2" opacity=".55" class="dash"/>
  <g class="float">
    <rect x="82" y="52" width="178" height="34" rx="17" fill="#071827" stroke="#1E3A5F"/>
    <circle cx="103" cy="69" r="5" fill="#22C55E" class="pulse"/><text x="118" y="74" fill="#BAE6FD" font-size="13" class="mono">SYSTEMS ONLINE</text>
  </g>
  <text x="600" y="118" text-anchor="middle" fill="#F8FAFC" font-size="48" font-weight="800" letter-spacing="3" class="sans">POOJANA KAVEESH</text>
  <text x="600" y="154" text-anchor="middle" fill="#7DD3FC" font-size="17" font-weight="600" letter-spacing="2" class="mono">SOFTWARE • PLATFORM • DISTRIBUTED SYSTEMS • AI</text>
  <rect x="350" y="180" width="500" height="1.5" fill="url(#accent)" opacity=".65"/>
  <text x="600" y="215" text-anchor="middle" fill="#CBD5E1" font-size="15" class="mono">understand → design → build → test → observe → ship<tspan class="blink">_</tspan></text>
  <g fill="#0B2036" stroke="#1D4ED8" opacity=".9">
    <rect x="364" y="240" width="112" height="30" rx="15"/><rect x="488" y="240" width="112" height="30" rx="15"/><rect x="612" y="240" width="112" height="30" rx="15"/><rect x="736" y="240" width="112" height="30" rx="15"/>
  </g>
  <g fill="#BFDBFE" font-size="12" text-anchor="middle" class="mono"><text x="420" y="259">JAVA 21</text><text x="544" y="259">SPRING</text><text x="668" y="259">K8S</text><text x="792" y="259">AI</text></g>
  <rect x="-180" y="0" width="120" height="300" fill="url(#accent)" opacity=".06" class="scan" transform="skewX(-16)"/>
</svg>
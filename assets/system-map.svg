<svg width="1200" height="250" viewBox="0 0 1200 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">Engineering system map</title><desc id="desc">Animated nodes connecting software, cloud, data, IoT and AI domains</desc>
<defs>
  <linearGradient id="line" x1="0" y1="0" x2="1200" y2="0"><stop stop-color="#0EA5E9"/><stop offset=".5" stop-color="#8B5CF6"/><stop offset="1" stop-color="#14B8A6"/></linearGradient>
  <radialGradient id="node"><stop stop-color="#0F2848"/><stop offset="1" stop-color="#06111F"/></radialGradient>
  <style>
    .wire{stroke:url(#line);stroke-width:2;fill:none;stroke-dasharray:7 9;animation:move 5s linear infinite}.n{animation:breathe 3s ease-in-out infinite}.t{font-family:'Courier New',monospace}.orb{animation:travel 6s linear infinite}
    @keyframes move{to{stroke-dashoffset:-160}}@keyframes breathe{0%,100%{opacity:.72}50%{opacity:1}}@keyframes travel{0%{offset-distance:0%}100%{offset-distance:100%}}
  </style>
</defs>
<rect width="1200" height="250" rx="22" fill="#030712" stroke="#172554"/>
<text x="55" y="42" fill="#F8FAFC" font-size="21" font-weight="700" class="t">ENGINEERING SYSTEM MAP</text>
<text x="55" y="65" fill="#64748B" font-size="12" class="t">projects connect fundamentals to production-style systems</text>
<path id="route" d="M155 145 C265 75 365 205 480 135 S705 72 820 145 S1010 204 1080 126" class="wire"/>
<circle r="5" fill="#38BDF8" class="orb"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#route"/></animateMotion></circle>
<g class="n"><circle cx="155" cy="145" r="43" fill="url(#node)" stroke="#0284C7" stroke-width="2"/><text x="155" y="141" text-anchor="middle" fill="#E0F2FE" font-size="13" class="t">SOFTWARE</text><text x="155" y="160" text-anchor="middle" fill="#38BDF8" font-size="10" class="t">JAVA • TS</text></g>
<g class="n" style="animation-delay:.5s"><circle cx="380" cy="154" r="43" fill="url(#node)" stroke="#7C3AED" stroke-width="2"/><text x="380" y="150" text-anchor="middle" fill="#EDE9FE" font-size="13" class="t">PLATFORM</text><text x="380" y="169" text-anchor="middle" fill="#A78BFA" font-size="10" class="t">API • K8S</text></g>
<g class="n" style="animation-delay:1s"><circle cx="600" cy="116" r="43" fill="url(#node)" stroke="#0F766E" stroke-width="2"/><text x="600" y="112" text-anchor="middle" fill="#CCFBF1" font-size="13" class="t">DATA</text><text x="600" y="131" text-anchor="middle" fill="#2DD4BF" font-size="10" class="t">PG • REDIS</text></g>
<g class="n" style="animation-delay:1.5s"><circle cx="820" cy="145" r="43" fill="url(#node)" stroke="#D97706" stroke-width="2"/><text x="820" y="141" text-anchor="middle" fill="#FEF3C7" font-size="13" class="t">IoT</text><text x="820" y="160" text-anchor="middle" fill="#F59E0B" font-size="10" class="t">EDGE • CLOUD</text></g>
<g class="n" style="animation-delay:2s"><circle cx="1050" cy="132" r="43" fill="url(#node)" stroke="#2563EB" stroke-width="2"/><text x="1050" y="128" text-anchor="middle" fill="#DBEAFE" font-size="13" class="t">AI</text><text x="1050" y="147" text-anchor="middle" fill="#60A5FA" font-size="10" class="t">NEXT STAGE</text></g>
<text x="600" y="226" text-anchor="middle" fill="#94A3B8" font-size="12" class="t">BUILD SYSTEMS THAT CAN BE EXPLAINED • TESTED • OBSERVED • IMPROVED</text>
</svg>